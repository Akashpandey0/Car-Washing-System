# =============================================================================
# SERVICE REGISTRY (EUREKA SERVER) CONFIGURATION
# =============================================================================
# Configuration Concepts Used:
# - Properties-based Configuration: External configuration pattern
# - Service Discovery Pattern: Central registry configuration
# - Port Configuration: Network endpoint specification
# - Self-Registration Prevention: Avoid circular registration
#
# This is the service discovery server for the microservices architecture
# All other services register here and discover each other through this registry

# =============================================================================
# SERVER CONFIGURATION
# =============================================================================
# server.port - Configures embedded Tomcat server port
# Standard Eureka server port (Netflix convention)
server.port=8761

# spring.application.name - Service identifier in Spring Cloud ecosystem
# Used for service registration and discovery
spring.application.name=service-registry

# =============================================================================
# EUREKA SERVER CONFIGURATION
# =============================================================================
# Configure this instance as a Eureka server (not a client)
# These settings prevent the server from trying to register with itself

# eureka.client.register-with-eureka - Controls self-registration
# false = Don't register this server with itself (it's the registry)
# Prevents circular dependency and unnecessary network calls
eureka.client.register-with-eureka=false

# eureka.client.fetch-registry - Controls registry fetching
# false = Don't fetch registry information (this server IS the registry)
# Prevents the server from trying to discover services from itself
eureka.client.fetch-registry=false

# eureka.client.service-url.defaultZone - Registry endpoint URL
# Service URL where other services will register and discover each other
# This URL is used by all microservices to connect to the registry
# Format: http://host:port/eureka/ (trailing slash important)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/